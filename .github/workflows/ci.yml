name: Проверка бота Краснодара

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run 18 offline checks
        run: python -m unittest -v test_bot.py
      - name: Preview Krasnodar news without publishing
        env:
          DRY_RUN: "true"
        run: python main.py
